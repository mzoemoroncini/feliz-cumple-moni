<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz cumpleaños, mi amor ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;overflow:hidden;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#f6b3c1,#e88fa3,#d9879d);background-size:300% 300%;animation:fondo 12s ease infinite}
    @keyframes fondo{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
    .inicio{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
    .inicio-contenido{width:min(100%,760px);text-align:center;animation:entrada 1s ease both}
    @keyframes entrada{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
    .corazon{display:inline-block;font-size:clamp(74px,16vw,120px);filter:drop-shadow(0 14px 22px rgba(100,35,55,.24));animation:latido 1.25s ease-in-out infinite}
    @keyframes latido{0%,100%{transform:scale(1)}20%{transform:scale(1.13)}50%{transform:scale(1.2)}70%{transform:scale(1)}}
    h1{margin:18px 0 6px;font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(58px,12vw,104px);line-height:1;color:white;text-shadow:0 6px 20px rgba(94,41,55,.18)}
    p{width:min(100%,580px);margin:12px auto 30px;font-size:clamp(15px,3.8vw,18px);line-height:1.6;color:rgba(255,255,255,.95)}
    .boton{display:inline-block;border-radius:999px;padding:16px 30px;background:white;color:#ad5f73;font-weight:600;font-size:16px;text-decoration:none;box-shadow:0 14px 35px rgba(92,35,53,.22);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .2s ease}
    .boton:active{transform:scale(.96)}
    .brillo{position:fixed;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none;animation:flotar 8s ease-in-out infinite alternate}
    .b1{width:220px;height:220px;left:-70px;top:-60px}.b2{width:300px;height:300px;right:-100px;bottom:-100px;animation-delay:2s}
    @keyframes flotar{to{transform:translate(35px,35px) scale(1.12)}}
  </style>
</head>
<body>
  <div class="brillo b1"></div><div class="brillo b2"></div>
  <main class="inicio">
    <section class="inicio-contenido">
      <div class="corazon">❤️</div>
      <h1>Para vos</h1>
      <p>Preparé algo chiquito para una persona enorme en mi vida.</p>
      <a class="boton" href="carta.html">Abrir mi regalo ❤️</a>
    </section>
  </main>
</body>
</html>
